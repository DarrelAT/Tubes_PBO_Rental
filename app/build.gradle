plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.guava
    
    // --> TAMBAHKAN INI AGAR DRIVER POSTGRESQL TERBACA <--
    implementation 'org.postgresql:postgresql:42.7.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Karena App.java ada di luar package / default package
    mainClass = 'App'
}

tasks.named('test') {
    useJUnitPlatform()
}